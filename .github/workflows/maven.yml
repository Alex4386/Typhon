# Builds the plugin jar and runs all tests with Gradle.
# (File name kept as maven.yml because docs link to this workflow.)

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 21
    - uses: gradle/actions/setup-gradle@v4
    - name: Build with Gradle
      run: |
        VER_TAG=$(git describe --tags --abbrev=0)
        ./gradlew build -Pversion=${VER_TAG}-SNAPSHOT
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        # Artifact name
        name: Typhon.jar
        # A file, directory or wildcard pattern that describes what to upload
        path: build/libs/typhon-*.jar
      
